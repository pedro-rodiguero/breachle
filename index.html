<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Breachle — daily cybersecurity puzzle games. Guess the vuln, triage the alerts, spot the phish." />
    <meta name="theme-color" content="#7c5cff" />
    <meta property="og:title" content="Breachle — daily security games" />
    <meta property="og:description" content="Four daily cybersecurity puzzles: guess the vuln, triage the alerts, spot the phish, name the malware. Same puzzle for everyone, every day." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Breachle — daily security games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      ;(() => {
        const stored = localStorage.getItem('breachle.theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
