name = "breachle-events"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Aggregate engagement events. No KV/DB — Analytics Engine only.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "breachle_events"

# Light per-IP flood guard on the beacon endpoint.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
